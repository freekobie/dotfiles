[buildPlans.ComposeMono]
family = "Compose Mono"
spacing = "normal"
serifs = "sans"
noCvSs = false
exportGlyphNames = false

[buildPlans.ComposeMono.variants.design]
one = "no-base"
three = "flat-top-serifless"
zero = "dotted"
capital-j = "serifed-both-sides"
capital-q = "crossing"
capital-w = "straight-flat-top-serifless"
f = "flat-hook-extended-crossbar-at-x-height"
i = "serifed"
j = "flat-hook-serifed"
r = "serifless"
t = "flat-hook"
w = "straight-flat-top-serifless"
y = "straight-turn-serifless"
brace = "curly-flat-boundary"
guillemet = "straight"
at = "threefold"
dollar = "open"
cent = "open"
percent = "rings-continuous-slash"
question = "corner"
lig-ltgteq = "slanted"
lig-neq = "more-slanted"
lig-equal-chain = "with-notch"
lig-plus-chain = "with-notch"
lig-double-arrow-bar = "with-notch"
lig-single-arrow-bar = "with-notch"

[buildPlans.ComposeMono.variants.italic]
one = "no-base"
three = "flat-top-serifless"
zero = "dotted"
capital-j = "serifed-both-sides"
capital-q = "crossing"
capital-w = "straight-flat-top-serifless"
a = "double-storey-serifless"
f = "flat-hook-extended-crossbar-at-x-height"
g = "double-storey"
i = "serifed"
j = "flat-hook-serifed"
k = "straight-serifless"
l = "serifed"
r = "serifless"
t = "flat-hook"
w = "straight-flat-top-serifless"
y = "straight-turn-serifless"
brace = "curly-flat-boundary"
guillemet = "straight"
at = "threefold"
dollar = "open"
cent = "open"
percent = "rings-continuous-slash"
question = "corner"
lig-ltgteq = "slanted"
lig-neq = "more-slanted"
lig-equal-chain = "with-notch"
lig-plus-chain = "with-notch"
lig-double-arrow-bar = "with-notch"
lig-single-arrow-bar = "with-notch"

[buildPlans.ComposeMono.ligations]
enables = [
  "kern-dotty",
  "kern-bars",
  "center-op-trigger-plus-minus-l",
  "center-op-trigger-plus-minus-r",
  "center-op-trigger-equal-r",
  "center-op-trigger-equal-l",
  "center-op-trigger-bar-l",
  "center-op-trigger-bar-r",
  "center-op-trigger-angle-inside",
  "center-op-trigger-angle-outside",
  "center-op-influence-dot",
  "center-op-influence-colon",
  "markdown-checkboxes",
  "llgg",
  "center-ops",
  "trig"
]

[buildPlans.ComposeMono.weights.Regular]
shape = 400
menu = 400
css = 400

[buildPlans.ComposeMono.weights.Bold]
shape = 700
menu = 700
css = 700

[buildPlans.ComposeMono.widths.Condensed]
shape = 500
menu = 4
css = "condensed"

[buildPlans.ComposeMono.widths.Normal]
shape = 548
menu = 5
css = "normal"

[buildPlans.ComposeMono.slopes.Upright]
angle = 0
shape = "upright"
menu = "upright"
css = "normal"

[buildPlans.ComposeMono.slopes.Italic]
angle = 9.4
shape = "italic"
menu = "italic"
css = "italic"
